name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install openpyxl pyinstaller

      - name: Compilar EXE
        run: pyinstaller --noconfirm --onefile --windowed --name "Archivo_Cronologico_Desguaces" --add-data "logo_alvale.png;." genera_cronologico_desguaces.py

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Archivo_Cronologico_Desguaces-Windows
          path: dist/Archivo_Cronologico_Desguaces.exe
          retention-days: 30
